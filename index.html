<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SumiFrame</title>

<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>

</head>

<body>

    <header>
        <h1>SumiFrame</h1>
        <p>UNTITLED PROJECT</p>

    </header>

      <main>

        <section class="tools">
            <h2>TOOLS</h2>
            <button id="pen-tool">Pen</button>
            <button id="eraser-tool">Eraser</button>

        </section>

        <section class="workspace">
            <div class="page">
                <canvas id="drawing-canvas" width="600" height="700"></canvas>

            </div>

        </section>

        <section class="properties">
            <h2>PROPERTIES</h2>

        <div class="property-control">
            <label for="brush-size">Brush Size: <span id="brush-size-value">5px</span></label>
            <input type="range" id="brush-size" min="1" max="50" value="5">
        </div>

        <div class="property-control">
            <label for="brush-color">Brush Color</label>
            <input type="color" id="brush-color" value="#000000">
        </div>

        <div class="property-control">
            <label for="brush-opacity">Opacity: <span id="brush-opacity-value">100%</span></label>
            <input type="range" id="brush-opacity" min="0" max="100" value="100">
        </div>

        </section>

      </main>
        
    <footer>
     <button id="undo-button">Undo</button>
     <button id="redo-button">Redo</button>

    </footer>
    
    
</body>


</html>
